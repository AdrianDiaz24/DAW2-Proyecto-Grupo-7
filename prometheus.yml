# Configuración de Prometheus para MindCare
#
# Este archivo es usado cuando se habilita Prometheus en docker-compose.yml
# Ubicación esperada: ./prometheus.yml (raíz del proyecto)
#
# Para usar:
# 1. Descomentar servicios 'prometheus' y 'grafana' en docker-compose.yml
# 2. Ejecutar: docker-compose up
# 3. Acceder a Prometheus: http://localhost:9090
# 4. Acceder a Grafana: http://localhost:3001

global:
  # Intervalo de scraping (recolección) de métricas
  scrape_interval: 15s

  # Intervalo de evaluación de reglas de alerta
  evaluation_interval: 15s

  # Etiquetas globales para todas las series
  external_labels:
    monitor: 'mindcare-monitoring'

# Configuración de alertas (opcional)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Cargar reglas de alerta (si existen)
rule_files:
  # - "alerts.yml"

# Configuración de scrape (targets a monitorear)
scrape_configs:
  # Monitor el propio Prometheus
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Monitor el backend MindCare
  - job_name: 'mindcare-api'
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['backend:4000']
    scrape_interval: 10s
    scrape_timeout: 5s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - source_labels: [__scheme__]
        target_label: scheme

