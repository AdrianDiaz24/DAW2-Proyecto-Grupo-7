
services:
  # Backend (Node.js/Express) - Conectado a MongoDB Atlas
  backend:
    # Nombre del contenedor
    container_name: mindcare-backend

    # Construir desde el Dockerfile local
    build:
      context: ./backend
      dockerfile: Dockerfile

    # Nombre de la imagen
    image: mindcare-backend:latest

    # Política de reinicio
    restart: unless-stopped

    # Variables de entorno
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      FRONTEND_URL: ${FRONTEND_URL}

    # Mapeo de puertos (host:contenedor)
    ports:
      - "4000:4000"

    # Red privada
    networks:
      - mindcare-network

    # Healthcheck para verificar estado del backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Etiquetas para organización
    labels:
      - "com.mindcare.description=Backend API REST de MindCare"
      - "com.mindcare.version=1.0"

  # Frontend (React + Nginx)
  frontend:
    # Nombre del contenedor
    container_name: mindcare-frontend

    # Construir desde el Dockerfile local
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL}

    # Nombre de la imagen
    image: mindcare-frontend:latest

    # Política de reinicio
    restart: unless-stopped

    # Mapeo de puertos (host:contenedor)
    ports:
      - "3000:80"

    # Dependencias: espera a que backend esté saludable
    depends_on:
      backend:
        condition: service_healthy

    # Red privada
    networks:
      - mindcare-network

    # Healthcheck para verificar estado del frontend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    # Etiquetas para organización
    labels:
      - "com.mindcare.description=Frontend React de MindCare"
      - "com.mindcare.version=1.0"

# Red privada para comunicación entre servicios
networks:
  mindcare-network:
    driver: bridge


