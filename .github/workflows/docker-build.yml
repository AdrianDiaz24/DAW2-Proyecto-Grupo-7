name: Docker Image CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Extraer versión del proyecto
        id: version
        run: |
          # Extraer versión del Dockerfile backend
          VERSION=$(grep 'LABEL version=' backend/Dockerfile | cut -d'"' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Versión detectada: $VERSION"

      - name: Login en DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir y etiquetar imágenes
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI || 'mongodb+srv://dummy:dummy@localhost/dummy' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'dummy-secret-key-for-build' }}
          JWT_EXPIRES_IN: 7d
          FRONTEND_URL: http://localhost:3000
          REACT_APP_API_URL: http://localhost:5000/api
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker compose build
          
          # Backend tags
          docker tag mindcare-backend:latest ${{ secrets.DOCKER_USERNAME }}/mindcare-backend:latest
          docker tag mindcare-backend:latest ${{ secrets.DOCKER_USERNAME }}/mindcare-backend:v${VERSION}
          docker tag mindcare-backend:latest ${{ secrets.DOCKER_USERNAME }}/mindcare-backend:${GITHUB_REF_NAME}
          
          # Frontend tags
          docker tag mindcare-frontend:latest ${{ secrets.DOCKER_USERNAME }}/mindcare-frontend:latest
          docker tag mindcare-frontend:latest ${{ secrets.DOCKER_USERNAME }}/mindcare-frontend:v${VERSION}
          docker tag mindcare-frontend:latest ${{ secrets.DOCKER_USERNAME }}/mindcare-frontend:${GITHUB_REF_NAME}

      - name: Subir imágenes a DockerHub
        if: github.event_name != 'pull_request'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Backend
          docker push ${{ secrets.DOCKER_USERNAME }}/mindcare-backend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/mindcare-backend:v${VERSION}
          docker push ${{ secrets.DOCKER_USERNAME }}/mindcare-backend:${GITHUB_REF_NAME}
          
          # Frontend
          docker push ${{ secrets.DOCKER_USERNAME }}/mindcare-frontend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/mindcare-frontend:v${VERSION}
          docker push ${{ secrets.DOCKER_USERNAME }}/mindcare-frontend:${GITHUB_REF_NAME}

      - name: Resumen de imágenes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "✅ Imágenes construidas exitosamente:"
          echo "🔹 Backend: ${{ secrets.DOCKER_USERNAME }}/mindcare-backend:latest"
          echo "🔹 Backend: ${{ secrets.DOCKER_USERNAME }}/mindcare-backend:v${VERSION}"
          echo "🔹 Backend: ${{ secrets.DOCKER_USERNAME }}/mindcare-backend:${GITHUB_REF_NAME}"
          echo "🔹 Frontend: ${{ secrets.DOCKER_USERNAME }}/mindcare-frontend:latest"
          echo "🔹 Frontend: ${{ secrets.DOCKER_USERNAME }}/mindcare-frontend:v${VERSION}"
          echo "🔹 Frontend: ${{ secrets.DOCKER_USERNAME }}/mindcare-frontend:${GITHUB_REF_NAME}"
          echo "🔹 Backend: ${{ secrets.DOCKER_USERNAME }}/mindcare-backend:latest"
          echo "🔹 Frontend: ${{ secrets.DOCKER_USERNAME }}/mindcare-frontend:latest"
