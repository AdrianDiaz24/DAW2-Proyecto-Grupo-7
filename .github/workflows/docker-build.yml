name: Docker Image CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Login en DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir y etiquetar imágenes
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI || 'mongodb+srv://dummy:dummy@localhost/dummy' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'dummy-secret-key-for-build' }}
          JWT_EXPIRES_IN: 7d
          FRONTEND_URL: http://localhost:3000
          REACT_APP_API_URL: http://localhost:5000/api
        run: |
          docker compose build
          docker tag mindcare-backend:latest ${{ secrets.DOCKER_USERNAME }}/mindcare-backend:latest
          docker tag mindcare-backend:latest ${{ secrets.DOCKER_USERNAME }}/mindcare-backend:${{ github.sha }}
          docker tag mindcare-frontend:latest ${{ secrets.DOCKER_USERNAME }}/mindcare-frontend:latest
          docker tag mindcare-frontend:latest ${{ secrets.DOCKER_USERNAME }}/mindcare-frontend:${{ github.sha }}

      - name: Subir imágenes a DockerHub
        if: github.event_name != 'pull_request'
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/mindcare-backend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/mindcare-backend:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/mindcare-frontend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/mindcare-frontend:${{ github.sha }}

      - name: Resumen de imágenes
        run: |
          echo "✅ Imágenes construidas exitosamente:"
          echo "🔹 Backend: ${{ secrets.DOCKER_USERNAME }}/mindcare-backend:latest"
          echo "🔹 Frontend: ${{ secrets.DOCKER_USERNAME }}/mindcare-frontend:latest"

