name: Build Docs (PDF & HTML + Code Docs)

on:
  push:
    paths:
      - 'docs/**'
      - 'backend/src/**'
      - 'frontend/src/**'
      - 'jsdoc.json'
      - '.github/workflows/docs-build.yml'
  workflow_dispatch:

jobs:
  # 1) Documentación funcional (Markdown -> PDF/HTML)
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build docs root
        uses: BaileyJM02/markdown-to-pdf@v1.2.0
        with:
          input_dir: docs
          output_dir: docs-export
          build_pdf: true
          build_html: true

      - name: Build docs arquitectura
        uses: BaileyJM02/markdown-to-pdf@v1.2.0
        with:
          input_dir: docs/arquitectura
          output_dir: docs-export/arquitectura
          build_pdf: true
          build_html: true

      - name: Build docs Sprints Review
        uses: BaileyJM02/markdown-to-pdf@v1.2.0
        with:
          input_dir: "docs/sprintreview"
          output_dir: "docs-export/sprintreview"
          build_pdf: true
          build_html: true

      - name: Build docs wiki
        uses: BaileyJM02/markdown-to-pdf@v1.2.0
        with:
          input_dir: docs/wiki
          output_dir: docs-export/wiki
          build_pdf: true
          build_html: true

      - name: Upload docs artifacts
        uses: actions/upload-artifact@v4
        with:
          name: project-docs
          path: docs-export

  # 2) Documentación de código (JSDoc sobre backend/src y frontend/src)
  build-code-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'

      - name: Install dependencies
        run: npm install

      - name: Generate code documentation (JSDoc)
        run: npm run docs:code

      - name: Upload code docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-docs
          path: code-docs
