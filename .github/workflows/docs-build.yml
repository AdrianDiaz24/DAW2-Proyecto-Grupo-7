name: Build Docs (PDF & HTML)

on:
  push:
    paths:
      - 'docs/**'
      - '.github/workflows/docs-build.yml'
  workflow_dispatch:

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build PDF & HTML from Markdown (incluye subcarpetas)
        uses: BaileyJM02/markdown-to-pdf@v1.2.0
        with:
          input_dir: docs           # lee docs y TODAS sus subcarpetas
          output_dir: docs-export   # se crean las mismas subcarpetas aquí
          images_dir: docs          # raíz donde pueden estar las imágenes
          image_import: .           # rutas relativas se mantienen
          build_pdf: true
          build_html: true

      - name: Upload docs artifacts
        uses: actions/upload-artifact@v4
        with:
          name: project-docs
          path: docs-export
