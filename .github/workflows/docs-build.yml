name: Build Docs (PDF & HTML + Code Docs)

on:
  push:
    paths:
      - 'docs/**'
      - 'backend/src/**'
      - 'frontend/src/**'
      - 'jsdoc.json'
      - '.github/workflows/docs-build.yml'
  workflow_dispatch:

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # docs/ raíz (si hay .md sueltos)
      - name: Build docs root
        uses: BaileyJM02/markdown-to-pdf@v1.2.0
        with:
          input_dir: docs
          output_dir: docs-export
          build_pdf: true
          build_html: true

      - name: Build docs arquitectura
        uses: BaileyJM02/markdown-to-pdf@v1.2.0
        with:
          input_dir: docs/arquitectura
          output_dir: docs-export/arquitectura
          build_pdf: true
          build_html: true

      - name: Build docs sprintreview
        uses: BaileyJM02/markdown-to-pdf@v1.2.0
        with:
          input_dir: docs/sprintreview
          output_dir: docs-export/sprintreview
          build_pdf: true
          build_html: true

      - name: Build docs wiki
        uses: BaileyJM02/markdown-to-pdf@v1.2.0
        with:
          input_dir: docs/wiki
          output_dir: docs-export/wiki
          build_pdf: true
          build_html: true


  # 2) Documentación de código (JSDoc sobre backend/src y frontend/src)
  build-code-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'

      - name: Install dependencies
        run: npm install

      - name: Generate code documentation (JSDoc)
        run: npm run docs:code

      - name: Upload code docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-docs
          path: code-docs
#3) Build and push Docker images (backend y frontend)
  build-docker:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout repo
          uses: actions/checkout@v4

        - name: Login to Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}

        - name: Build and push backend
          uses: docker/build-push-action@v6
          with:
            context: ./backend
            push: true
            tags: joseantoniodiazbusati/mindcare:latest

        - name: Build and push frontend
          uses: docker/build-push-action@v6
          with:
            context: ./frontend
            push: true
            tags: joseantoniodiazbusati/mindcare:latest