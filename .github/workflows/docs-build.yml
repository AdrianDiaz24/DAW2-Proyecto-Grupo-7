name: Generador de Documentación JSDoc

permissions:
  contents: write

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  generate-jsdoc:
    runs-on: ubuntu-latest

    steps:
      # Clonar repo
      - name: Clonar repo
        uses: actions/checkout@v4

      # Configuración Node.js
      - name: Configuración Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # Instalar dependencias
      - name: Instalar dependencias
        run: npm install

      # Generar JSDoc HTML
      - name: Generar JSDoc HTML
        run: npm run docs:code

      # Instalar wkhtmltopdf para generar PDFs
      - name: Instalación wkhtmltopdf
        run: sudo apt-get update && sudo apt-get install -y wkhtmltopdf

      # Generar PDFs desde HTML
      - name: Convertir HTMLs a PDFs
        run: |
          mkdir -p code-docs/pdf
          for html in $(find code-docs -maxdepth 1 -type f -name "*.html"); do
            filename=$(basename "$html" .html)
            echo "Generando $filename.pdf..."
            wkhtmltopdf --enable-local-file-access "$html" "code-docs/pdf/$filename.pdf"
          done
          
          echo "Archivos PDF generados:"
          find code-docs/pdf -type f -name "*.pdf"

      # Subir PDFs como artefactos
      - name: Subir PDFs como artefactos
        uses: actions/upload-artifact@v4
        with:
          name: jsdoc-pdfs
          path: code-docs/pdf/**/*.pdf
          retention-days: 90

      # Subir toda la documentación HTML como artefacto
      - name: Subir documentación HTML
        uses: actions/upload-artifact@v4
        with:
          name: jsdoc-html
          path: code-docs/**/*
          retention-days: 90

      # Desplegar a GitHub Pages
      - name: Desplegar JSDoc a GitHub Pages
        uses: Cecilapp/GitHub-Pages-deploy@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          email: github-actions[bot]@users.noreply.github.com
          build_dir: code-docs
          branch: gh-pages
          commit_message: "Actualizar documentación JSDoc [skip ci]"

