name: Build Docs (PDF & HTML + Code Docs)

on:
  push:
    paths:
      - 'docs/**'
      - 'backend/src/**'
      - 'frontend/src/**'
      - 'jsdoc.json'
      - '.github/workflows/docs-build.yml'
  workflow_dispatch:

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Convertir documentación Markdown a PDF/HTML
      - name: Build docs root (Markdown files)
        uses: BaileyJM02/markdown-to-pdf@v1.2.0
        with:
          input_dir: docs
          output_dir: docs-export
          build_pdf: true
          build_html: true
        continue-on-error: true

      - name: Build docs sprintreview
        uses: BaileyJM02/markdown-to-pdf@v1.2.0
        with:
          input_dir: docs/sprintreview
          output_dir: docs-export/sprintreview
          build_pdf: true
          build_html: true
        continue-on-error: true

      # Subir documentación generada como artifact
      - name: Upload docs artifacts (PDF & HTML)
        uses: actions/upload-artifact@v4
        with:
          name: docs-export
          path: docs-export
        if: always()


  # Documentación de código (JSDoc sobre backend/src y frontend/src)
  build-code-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Generate code documentation (JSDoc)
        run: npm run docs:code

      - name: Upload code docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-docs
          path: code-docs

      - name: Deploy code docs to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./code-docs
          destination_dir: api-docs

